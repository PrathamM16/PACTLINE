databases:
  - name: pactline-db
    plan: free

services:
  - type: web
    name: pactline-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pactline-db
          property: connectionString
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: MURF_API_KEY
        sync: false
      - key: MURF_VOICE_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: JENKINS_BASE_URL
        sync: false
      - key: JENKINS_USERNAME
        sync: false
      - key: JENKINS_API_TOKEN
        sync: false
      - key: SONARQUBE_CLOUD_URL
        sync: false
      - key: SONARQUBE_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: pactline-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/pactline/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
